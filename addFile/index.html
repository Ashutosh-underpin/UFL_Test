<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Ultimate Fire Link</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: black;
    }

    #unity-canvas {
      height: 100%;
      width: 100%;
    }

    #loading-screen {
      position: absolute;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    let AspectRatio; // Initialize AspectRatio globally

    // Function to detect if the device is mobile
    function isMobile(unityInstance) {
      console.log("Called isMobile");

      const userAgent = navigator.userAgent || navigator.vendor || window.opera;

      // Check for mobile devices
      const isMobile = /android/i.test(userAgent) || /iPhone|iPad|iPod/i.test(userAgent) || /Windows Phone/i.test(userAgent);

      let s = "";
      if (isMobile) {
        s = "A";
        AspectRatio = 9 / 16; // Mobile Portrait Mode (9:16 aspect ratio)
      } else {
        AspectRatio = 16 / 9; // PC Landscape Mode (16:9 aspect ratio)
        s = "B";
      }

      if (typeof unityInstance !== "undefined") {
        unityInstance.SendMessage('CanvasSwitcher', 'OnMobileDeviceDetected', s);
      } else {
        console.log("Unity instance is undefined");
      }
    }

    // Resize canvas based on device type and window size
    function resizeCanvas() {
      let windowWidth = window.innerWidth;
      let windowHeight = window.innerHeight;

      if (AspectRatio === 9 / 16) {
        // Mobile Portrait Mode (9:16 aspect ratio)
        let canvasWidth = windowWidth;
        let canvasHeight = canvasWidth * AspectRatio;

        if (canvasHeight > windowHeight) {
          canvasHeight = windowHeight;
          canvasWidth = canvasHeight * (1 / AspectRatio);
        }

        canvas.style.width = `${canvasWidth}px`;
        canvas.style.height = `${canvasHeight}px`;
      } else {
        // PC Landscape Mode (16:9 aspect ratio)
        let canvasWidth = windowWidth;
        let canvasHeight = canvasWidth / AspectRatio;

        if (canvasHeight > windowHeight) {
          canvasHeight = windowHeight;
          canvasWidth = canvasHeight * AspectRatio;
        }

        canvas.style.width = `${canvasWidth}px`;
        canvas.style.height = `${canvasHeight}px`;
      }
    }

    // Call resizeCanvas whenever the window is resized
    window.addEventListener("resize", resizeCanvas);

    // Call resizeCanvas on initial load
    window.addEventListener('load', resizeCanvas);

    // Set up Unity loading script
    const buildUrl = "Build";
    const loaderUrl = `${buildUrl}/UFL Bild.loader.js`;
    const config = {
      dataUrl: `${buildUrl}/UFL Bild.data.unityweb`,
      frameworkUrl: `${buildUrl}/UFL Bild.framework.js.unityweb`,
      codeUrl: `${buildUrl}/UFL Bild.wasm.unityweb`,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Ultimate Fire Link",
      productVersion: "1.0",
    };

    // Dynamically load Unity instance
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        // Optionally show progress
      }).then((unityInstance) => {
        // Ensure that `isMobile` is called after Unity is initialized
        setTimeout(() => { isMobile(unityInstance); }, 6);
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
  
  <script type="text/javascript">
    // Uncomment to suppress console logs
    // console.log = function() {};
    // console.warn = function() {};
    // console.error = function() {};
  </script>

</body>

</html>
